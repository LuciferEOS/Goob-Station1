# legs

- type: entity
  id: MagLeftLeg
  parent: LeftLegCybernetic
  name: left magleg
  description: Standart issued nanotrasen magboots integrated inside your legs.
  components:
  - type: Damageable
    damageContainer: Silicon
  - type: MovementBodyPart
    walkSpeed: 2
    sprintSpeed: 4
  - type: BodyPart
    baseLayerId: MobCyberneticMagLegLeft
    onAdd:
    - type: ComponentToggler
      components:
      - type: NoSlip
    - type: Magboots
    - type: ToggleClothing
      action: ActionToggleMagboots
      mustEquip: false
      disableOnUnequip: true
    - type: ItemToggle
      onUse: true
  - type: Cybernetics
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Cybernetics/magleg.rsi
    state: "l_leg-combined"
  - type: GenerateChildPart
