# this works, trust.
- type: entity
  parent: LeftArmCyberneticBase
  id: HammerLeftArm
  name: hammer left arm
  description: A cybernetic left arm made out of hard plasteel, great for removing walls and faces.
  components:
  - type: BodyPart
    baseLayerId: MobCyberneticV2ArmLeft
    onAdd:
    - type: MeleeThrowOnHit
      speed: 5
      lifetime: 0.5
    - type: MeleeWeapon
      angle: 0
      damage:
        types:
          Blunt: 10
          Structural: 15
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Cybernetics/bloodhand.rsi
    state: "l_arm-combined"
  - type: GenerateChildPart
    id: HammerLeftHand

- type: entity
  id: HammerLeftHand
  parent: LeftHandCybernetic
  name: hammer left hand
  components:
  - type: Damageable
    damageContainer: Silicon
  - type: BodyPart
    baseLayerId: MobCyberneticV2HandLeft
  - type: Cybernetics
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Cybernetics/bloodhand.rsi
    state: "l_hand"
