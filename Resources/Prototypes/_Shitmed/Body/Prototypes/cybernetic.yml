- type: entity
  id: DrillLeftArm
  parent: LeftArmCyberneticBase
  name: drill left arm
  description: A simple drill arm, capable of, suprisingly, drilling, mostly rock.
  components:
  - type: BodyPart
    baseLayerId: MobCyberneticDrillArmLeft
    onAdd:
     - type: Tag
       tags:
       - Pickaxe # i guess it should work like one
     - type: MeleeWeapon
       autoAttack: true
       angle: 0
       wideAnimationRotation: -90
       soundHit:
         path: "/Audio/Items/drill_hit.ogg"
       attackRate: 4
       heavyStaminaCost: 0
       damage:
         groups:
           Brute: 3
         types:
           Structural: 15
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Cybernetics/drillhand.rsi
    state: "l_arm-combined"
  - type: GenerateChildPart
    id: DrillLeftHand

