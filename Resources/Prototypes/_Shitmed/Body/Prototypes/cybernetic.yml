
# this works, trust.
# okay so heres the problem
# this shit adds components when attached to a humanoid
# but this stuff doesnt update them, and if humanoid has meleeweapon comp
# the only way to update its values is to attach + remove + attach new limb, damn i love shitmed
# oh and btw they dont stack
- type: entity
  parent: LeftArmCybernetic
  id: HammerLeftArm
  name: hammer left arm
  description: A cybernetic left arm made out of hard plasteel, great for removing walls and faces.
  components:
  - type: BodyPart
    baseLayerId: MobCyberneticV2ArmLeft
    onAdd:
    - type: MeleeThrowOnHit
      speed: 5
      lifetime: 0.5
    - type: MeleeWeapon
      angle: 0
      damage:
        types:
          Blunt: 10
          Structural: 15
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Cybernetics/bloodhand.rsi
    state: "l_arm-combined"

- type: entity
  id: HammerLeftHand
  parent: LeftHandCybernetic
  name: hammer left hand
  components:
  - type: Damageable
    damageContainer: Silicon
  - type: BodyPart
    baseLayerId: MobCyberneticV2HandLeft
  - type: Cybernetics
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Cybernetics/bloodhand.rsi
    state: "l_hand"
