- type: entity
  id: ActionToggleProtoKinetic
  name: Toggle Proto Kinetic Accelerator
  description: Activate your hands combat mode. Retract on secondary use.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 3
    itemIconStyle: NoItem
    icon:
      sprite: _Shitmed\Objects\Weapons\Guns\Battery\cybernetics.rsi
      state: icon-hand-proto
    event: !type:ToggleProtoKineticActionEvent

- type: entity
  id: TestHandProto
  name: TestHandProto
  parent: LeftArmCybernetic
  components:
  - type: Cybernetics
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Cybernetics/insulhand.rsi
    state: "r_arm-combined"
  - type: Damageable
    damageContainer: Silicon
  - type: BodyPart
    baseLayerId: MobCyberneticInsulArmRight
    onAdd:
    - type: ToggleProtokinetic

